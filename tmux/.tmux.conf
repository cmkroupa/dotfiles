# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# truecolor, curly/colored underlines, and clipboard over OSC 52, whatever the outer terminal is
set -as terminal-features ",*:RGB:usstyle:clipboard"
set -g focus-events on
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0

# ── Option-key commands (-N notes are what `keys` prints) ─────────────────────
bind -n -N "pane left"  M-h select-pane -L
bind -n -N "pane down"  M-j select-pane -D
bind -n -N "pane up"    M-k select-pane -U
bind -n -N "pane right" M-l select-pane -R

bind -n -N "previous window" M-a previous-window
bind -n -N "next window"     M-d next-window
bind -n -N "move window left"  M-1 swap-window -d -t -1
bind -n -N "move window right" M-2 swap-window -d -t +1

bind -n -N "split side-by-side" M-i split-window -h -c "#{pane_current_path}"
bind -n -N "split top/bottom"   M-u split-window -v -c "#{pane_current_path}"
bind -n -N "new window"         M-t new-window -c "#{pane_current_path}"

# Popups: float over the current window, close when the program exits
bind -n -N "lazygit popup"  M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind -n -N "scratch shell"  M-s display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind -n -N "open a project" M-p display-popup -E -w 60% -h 60% \
  'd=$(ls -d ~/Projects/*/ | fzf --reverse) && tmux new-window -c "$d"'

bind -n -N "close pane"   M-x kill-pane
bind -n -N "resize down"  M-- resize-pane -D 5
bind -n -N "resize up"    M-= resize-pane -U 5
bind -n -N "resize left"  M-_ resize-pane -L 5
bind -n -N "resize right" M-+ resize-pane -R 5

# also sends URG to every pane's zsh, which re-sources ~/.zshrc (see TRAPURG there)
bind -n -N "reload tmux + zsh config" M-r source-file ~/.tmux.conf \; \
  run-shell 'for p in $(tmux list-panes -a -F "##{pane_pid}"); do case $(ps -o comm= -p $p) in *zsh) kill -URG $p ;; esac; done' \; \
  display-message "config reloaded"

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
set -g mode-keys vi
bind -T copy-mode-vi -N "start selection" v send-keys -X begin-selection
# the terminal (Ghostty, Windows Terminal, ...) puts the copy on the system clipboard
bind -T copy-mode-vi -N "copy to clipboard" y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ── Status Bar & Aesthetics ───────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style bg=default,fg=colour245
set -g status-left ""
set -g status-right "#[fg=colour245]%H:%M:%S #[fg=colour240]| #[fg=cyan]%d-%b-%y "
set -g window-status-current-format "#[fg=cyan,bold][#I]"
set -g window-status-format "#[fg=colour244][#I]"

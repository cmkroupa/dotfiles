# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g focus-events on
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0

# ── Splits & Window Navigation (Option key / Meta) ──────────────────────────────────
# Option+p: Vertical split (|)
bind -n M-p split-window -h -c "#{pane_current_path}"

# Option+n: New window
bind -n M-n new-window -c "#{pane_current_path}"

# Option+l: Go left (previous window)
# Option+r: Go right (next window)
bind -n M-l previous-window
bind -n M-r next-window

# Option+k: Kill current window (page)
# Option+d: Delete/kill current pane
bind -n M-k kill-window
bind -n M-d kill-pane


# ── Vim-style pane navigation (Ctrl + h/j/k/l) ───────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '([^TXZ ]+ +)?(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "pbcopy 2>/dev/null || clip.exe 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel --clipboard --input"
unbind -T copy-mode-vi MouseDragEnd1Pane

# ── Status Bar & Aesthetics ───────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style bg=default,fg=colour245
set -g status-left ""
set -g status-right "#[fg=colour245]%H:%M:%S #[fg=colour240]| #[fg=cyan]%d-%b-%y "
set -g window-status-current-format "#[fg=cyan,bold][#I:#W]"
set -g window-status-format "#[fg=colour244]#I:#W "


# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g status off

run '~/.tmux/plugins/tpm/tpm'

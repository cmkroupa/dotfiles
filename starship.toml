format = """
$directory${custom.git_dirty}${custom.git_ahead}${custom.git_clean}$git_status$character"""

add_newline = false

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
disabled = true

# ── Coloured branch (one shows at a time) ─────────────────────────────────────
[custom.git_dirty]
description = "Branch red when uncommitted changes exist"
command = "git branch --show-current"
when = 'git status --porcelain 2>/dev/null | grep -q .'
style = "bold red"
format = "[ $output]($style) "

[custom.git_ahead]
description = "Branch yellow when clean but unpushed commits exist"
command = "git branch --show-current"
when = 'test -z "$(git status --porcelain 2>/dev/null)" && git rev-list "@{upstream}..HEAD" 2>/dev/null | grep -q .'
style = "bold yellow"
format = "[ $output]($style) "

[custom.git_clean]
description = "Branch green when fully up to date"
command = "git branch --show-current"
when = 'test -z "$(git status --porcelain 2>/dev/null)" && ! git rev-list "@{upstream}..HEAD" 2>/dev/null | grep -q .'
style = "bold green"
format = "[ $output]($style) "

[git_status]
style = "bold red"
format = "([$all_status]($style) )"
conflicted = "󰦚 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = ""
modified = ""
staged = ""
deleted = ""

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold orange"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

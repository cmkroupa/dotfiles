format = """
$directory$git_branch$git_status$character"""

add_newline = false

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰦚 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = ""
modified = ""
staged = ""
deleted = ""

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold orange"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

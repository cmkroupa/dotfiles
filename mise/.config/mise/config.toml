[tools]
# Languages
node = "lts"
pnpm = "latest"
python = "latest"
# Rails goes into this Ruby (not mise's isolated gem: backend, which hides gems from bundle)
ruby = { version = "latest", postinstall = "gem install rails" }
lua = "latest"

# CLI tools: same versions on macOS and Ubuntu, newer than apt's
neovim = "latest"
fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
zoxide = "latest"
starship = "latest"
lazygit = "latest"
lazydocker = "latest"
